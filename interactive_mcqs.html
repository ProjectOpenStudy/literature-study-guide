<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Literature Quiz | OpenStudy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    <script>
        // Sample questions. These can be expanded later by parsing the PDFs or manual entry.
        const questions = [
            {
                question: "Who is known as the father of English Poetry?",
                options: ["William Shakespeare", "John Milton", "Geoffrey Chaucer", "William Wordsworth"],
                answer: 2
            },
            {
                question: "In which year was the Lyrical Ballads published?",
                options: ["1798", "1600", "1832", "1750"],
                answer: 0
            },
            {
                question: "Which of the following was written by Christopher Marlowe?",
                options: ["Macbeth", "Dr. Faustus", "The Faerie Queene", "Paradise Lost"],
                answer: 1
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-text').innerText = `${currentQuestion + 1}. ${q.question}`;
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border border-gray-200 hover:border-indigo-500 hover:bg-indigo-50 transition-all font-medium text-gray-700 mb-3";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
            
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('progress-text').innerText = `Question ${currentQuestion + 1} of ${questions.length}`;
            const progressPercent = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
        }

        function checkAnswer(selectedIndex, btnElement) {
            // Disable all buttons
            const buttons = document.getElementById('options-container').children;
            for (let b of buttons) {
                b.disabled = true;
                b.classList.add('opacity-75', 'cursor-not-allowed');
                b.classList.remove('hover:border-indigo-500', 'hover:bg-indigo-50');
            }

            const q = questions[currentQuestion];
            const feedback = document.getElementById('feedback');
            feedback.classList.remove('hidden');

            if (selectedIndex === q.answer) {
                btnElement.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-800');
                btnElement.classList.remove('border-gray-200', 'text-gray-700');
                feedback.innerHTML = `<span class="text-emerald-600 font-bold">✅ Correct!</span>`;
                score++;
            } else {
                btnElement.classList.add('border-red-500', 'bg-red-50', 'text-red-800');
                btnElement.classList.remove('border-gray-200', 'text-gray-700');
                buttons[q.answer].classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-800');
                buttons[q.answer].classList.remove('border-gray-200', 'text-gray-700');
                feedback.innerHTML = `<span class="text-red-600 font-bold">❌ Incorrect!</span> The correct answer is <b>${q.options[q.answer]}</b>.`;
            }
            
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('results-container').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = `100%`;
            
            const percent = Math.round((score / questions.length) * 100);
            document.getElementById('score-text').innerText = `${score} / ${questions.length}`;
            document.getElementById('percent-text').innerText = `${percent}%`;
            
            if (percent >= 80) {
                document.getElementById('result-message').innerText = "Outstanding work! You're ready for the exam.";
            } else if (percent >= 50) {
                document.getElementById('result-message').innerText = "Good effort! Keep practicing those PDFs.";
            } else {
                document.getElementById('result-message').innerText = "Don't give up! Review the study materials and try again.";
            }
        }

        window.onload = loadQuestion;
    </script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col items-center py-10">

    <div class="w-full max-w-3xl px-4">
        <a href="index.html" class="inline-flex items-center text-indigo-600 font-semibold mb-6 hover:text-indigo-800 transition">
            &larr; Back to Home
        </a>
        
        <!-- Progress Bar -->
        <div class="bg-white rounded-2xl shadow-sm p-4 mb-6 flex items-center justify-between">
            <span id="progress-text" class="text-sm font-bold text-gray-500">Question 1 of 3</span>
            <div class="w-2/3 bg-gray-200 rounded-full h-2.5">
                <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <!-- Quiz Container -->
        <div id="quiz-container" class="bg-white rounded-3xl shadow-xl overflow-hidden">
            <div class="p-8 md:p-12">
                <h2 id="question-text" class="text-2xl md:text-3xl font-extrabold text-gray-900 mb-8 leading-tight">Loading question...</h2>
                
                <div id="options-container" class="space-y-3">
                    <!-- Options will be injected here -->
                </div>
                
                <div id="feedback" class="mt-6 p-4 rounded-xl bg-gray-50 hidden text-lg"></div>
            </div>
            <div class="bg-gray-50 px-8 py-6 border-t border-gray-100 flex justify-end">
                <button id="next-btn" onclick="nextQuestion()" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-indigo-200 transition-all transform hover:-translate-y-0.5">
                    Next Question &rarr;
                </button>
            </div>
        </div>

        <!-- Results Container -->
        <div id="results-container" class="bg-white rounded-3xl shadow-xl overflow-hidden hidden text-center">
            <div class="p-12 md:p-16">
                <div class="w-24 h-24 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <h2 class="text-4xl font-extrabold text-gray-900 mb-2">Quiz Completed!</h2>
                <p id="result-message" class="text-lg text-gray-500 mb-8">Let's see how you did.</p>
                
                <div class="flex justify-center gap-8 mb-10">
                    <div>
                        <p class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-1">Score</p>
                        <p id="score-text" class="text-4xl font-black text-indigo-600">0 / 0</p>
                    </div>
                    <div class="w-px bg-gray-200"></div>
                    <div>
                        <p class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-1">Accuracy</p>
                        <p id="percent-text" class="text-4xl font-black text-emerald-500">0%</p>
                    </div>
                </div>
                
                <a href="interactive_mcqs.html" class="inline-block bg-gray-900 hover:bg-gray-800 text-white font-bold py-4 px-10 rounded-xl shadow-xl transition-all">
                    Retry Quiz
                </a>
            </div>
        </div>
        
    </div>
</body>
</html>
